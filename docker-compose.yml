services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the Vite bundle at image build time
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_USE_LOCAL_DEV_PIPELINE: ${VITE_USE_LOCAL_DEV_PIPELINE:-true}
    image: dental-cad-viewer:local
    ports:
      # Host 3000 → container nginx on 80 (matches local Vite port)
      - "3000:80"
    restart: unless-stopped
